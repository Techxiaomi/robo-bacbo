<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bac Bo - Login administrativo</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111318;
            color: #f2f2f2;
        }
        .card {
            width: min(92vw, 390px);
            padding: 28px;
            border: 1px solid #2d313a;
            border-radius: 14px;
            background: #191c22;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { color: #aeb4c0; margin: 0 0 22px; }
        label { display: block; margin: 14px 0 6px; font-size: 13px; }
        input {
            width: 100%;
            border: 1px solid #343a46;
            border-radius: 9px;
            padding: 11px 12px;
            background: #101216;
            color: #fff;
            outline: none;
        }
        input:focus { border-color: #f08a32; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px 14px;
            border: 0;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            background: #f08a32;
            color: #111;
        }
        #erro {
            display: none;
            margin: 14px 0 0;
            padding: 10px;
            border-radius: 8px;
            background: #4a1f23;
            color: #ffd6d9;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Robo Bac Bo</h1>
        <p>Autenticacao administrativa</p>
        <form method="post" action="/auth/login" autocomplete="on">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="erro">Usuario ou senha invalidos.</div>
    </main>
    <script>
        if (new URLSearchParams(location.search).get('erro') === '1') {
            document.getElementById('erro').style.display = 'block';
        }
    </script>
</body>
</html>
