<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Bac Bo</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #boot { padding: 24px; text-align: center; color: #888; }
    </style>
</head>
<body>
    <div id="boot">Carregando painel...</div>
    <script>
        (async () => {
            try {
                const response = await fetch('/dashboard-app.html?_t=' + Date.now(), {
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);

                let html = await response.text();
                const fechamentoHead = '</head>';
                const scriptDashboard = '<script src="/dashboard-ui.js"></' + 'script>';
                if (!html.includes(fechamentoHead)) throw new Error('Estrutura HTML do painel inválida');
                html = html.replace(fechamentoHead, '    ' + scriptDashboard + '\n' + fechamentoHead);

                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error('Falha ao carregar painel:', error);
                const boot = document.getElementById('boot');
                if (boot) boot.innerText = 'Falha ao carregar o painel.';
            }
        })();
    </script>
</body>
</html>
