<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Bac Bo</title>

    <!-- Somente dependências críticas entram no bootstrap. Assets pesados são lazy-loaded pela UI-4. -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/realtime-ui-scheduler.js"></script>
    <script src="/dashboard-ui.js"></script>
    <script src="/dom-ui2-transform.js"></script>
    <script src="/backtest-ui3-transform.js"></script>
    <script src="/resources-ui4.js"></script>

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #boot {
            padding: 24px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="boot">Carregando painel...</div>

    <script>
        (async () => {
            try {
                if (typeof window.io !== 'function') {
                    throw new Error('Cliente Socket.IO não carregado');
                }
                if (window.__realtimeUiSchedulerReady !== true) {
                    throw new Error('Scheduler realtime da interface não carregado');
                }
                if (typeof window.atualizarDashboardValores !== 'function') {
                    throw new Error('Controlador do dashboard não carregado');
                }
                if (window.__domUi2Ready !== true || typeof window.otimizarScriptPrincipalUI2 !== 'function') {
                    throw new Error('Transformador DOM UI-2 não carregado');
                }
                if (window.__backtestUi3Ready !== true || typeof window.otimizarScriptPrincipalUI3 !== 'function') {
                    throw new Error('Transformador Backtest UI-3 não carregado');
                }
                if (window.__resourceUi4Ready !== true || typeof window.otimizarScriptPrincipalUI4 !== 'function') {
                    throw new Error('Otimizações de recursos UI-4 não carregadas');
                }

                const response = await fetch('/dashboard-app.html?_t=' + Date.now(), {
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const html = await response.text();
                const parsed = new DOMParser().parseFromString(html, 'text/html');
                if (!parsed.head || !parsed.body) {
                    throw new Error('Estrutura HTML do painel inválida');
                }

                const scriptsInline = Array.from(parsed.querySelectorAll('script:not([src])'))
                    .map(script => script.textContent || '')
                    .filter(codigo => codigo.trim() !== '');

                const scriptPrincipal = scriptsInline.find(codigo => codigo.includes('const socketWeb = io();'));
                if (!scriptPrincipal) {
                    throw new Error('JavaScript principal do painel não encontrado');
                }
                const scriptPrincipalUi2 = window.otimizarScriptPrincipalUI2(scriptPrincipal);
                const scriptPrincipalUi3 = window.otimizarScriptPrincipalUI3(scriptPrincipalUi2);
                const scriptPrincipalOtimizado = window.otimizarScriptPrincipalUI4(scriptPrincipalUi3);

                // O documento-base ainda pode citar assets históricos; nenhum script dele é executado.
                parsed.querySelectorAll('script').forEach(script => script.remove());

                document.documentElement.lang = parsed.documentElement.lang || 'pt-BR';
                document.head.replaceChildren(
                    ...Array.from(parsed.head.childNodes).map(node => document.importNode(node, true))
                );
                document.body.replaceChildren(
                    ...Array.from(parsed.body.childNodes).map(node => document.importNode(node, true))
                );

                const script = document.createElement('script');
                script.textContent = scriptPrincipalOtimizado;
                document.body.appendChild(script);

                const finalizarInicializacao = () => {
                    // O HTML-base foi montado depois do DOMContentLoaded original do loader.
                    // Disparamos o evento somente depois de todos os controladores complementares.
                    window.dispatchEvent(new Event('DOMContentLoaded'));
                };

                const carregarLab = () => {
                    const lab = document.createElement('script');
                    lab.src = '/lab-enhancements.js?_t=' + Date.now();
                    lab.onload = () => {
                        if (typeof window.configurarLabPadroes === 'function') {
                            window.configurarLabPadroes();
                        }
                        finalizarInicializacao();
                    };
                    lab.onerror = () => {
                        console.error('Falha ao carregar aprimoramentos do Lab Padrões.');
                        finalizarInicializacao();
                    };
                    document.body.appendChild(lab);
                };

                const enhancements = document.createElement('script');
                enhancements.src = '/ui-enhancements.js?_t=' + Date.now();
                enhancements.onload = () => {
                    if (typeof window.aplicarAprimoramentosUI === 'function') {
                        window.aplicarAprimoramentosUI();
                    }
                    carregarLab();
                };
                enhancements.onerror = () => {
                    console.error('Falha ao carregar aprimoramentos da interface.');
                    carregarLab();
                };
                document.body.appendChild(enhancements);
            } catch (error) {
                console.error('Falha ao carregar painel:', error);
                const boot = document.getElementById('boot');
                if (boot) boot.innerText = 'Falha ao carregar o painel.';
            }
        })();
    </script>
</body>
</html>
