<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casas de Aposta | Painel Bac Bo</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px 0 40px; background:#121212; color:#fff; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        .container { max-width:1200px; margin:0 auto; padding:0 20px; }
        .topo { display:flex; align-items:center; justify-content:space-between; gap:15px; flex-wrap:wrap; border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:20px; }
        .topo h1 { margin:0; font-size:22px; }
        .subtitulo { color:#888; font-size:12px; margin-top:4px; }
        .acoes { display:flex; gap:8px; flex-wrap:wrap; }
        .btn { min-height:36px; padding:8px 16px; border:0; border-radius:6px; background:#007bff; color:#fff; font-weight:700; cursor:pointer; }
        .btn:hover { filter:brightness(1.1); }
        .btn.secundario { background:#333; color:#ddd; }
        .btn.perigo { background:#8d2530; }
        .btn.sucesso { background:#24843d; }
        .btn.pequeno { min-height:30px; padding:5px 10px; font-size:12px; }
        .toolbar { background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:12px 15px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .toolbar label { color:#aaa; font-size:12px; display:flex; align-items:center; gap:8px; }
        .status-msg { min-height:20px; font-size:12px; color:#aaa; }
        .status-msg.erro { color:#ff7777; }
        .status-msg.ok { color:#68d985; }
        #lista-casas { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
        .card { background:#1e1e1e; border:1px solid #333; border-left:4px solid #007bff; border-radius:8px; padding:16px; }
        .card.inativo { opacity:.65; border-left-color:#666; }
        .card-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
        .card h2 { margin:0 0 5px; font-size:16px; }
        .meta { color:#999; font-size:11px; overflow-wrap:anywhere; }
        .badge { display:inline-flex; align-items:center; gap:5px; border-radius:12px; padding:3px 8px; font-size:11px; font-weight:700; background:#333; }
        .badge.ativo { color:#8be79f; border:1px solid #285b36; background:#102016; }
        .badge.inativo { color:#ff9999; border:1px solid #683034; background:#241314; }
        .mesas-resumo { margin-top:14px; border-top:1px solid #333; padding-top:10px; }
        .mesa-linha { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid #292929; font-size:12px; }
        .mesa-linha:last-child { border-bottom:0; }
        .card-acoes { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
        .vazio { grid-column:1/-1; padding:30px; text-align:center; color:#777; border:1px dashed #333; border-radius:8px; background:#181818; }
        .modal { display:none; position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.86); padding:20px; align-items:center; justify-content:center; }
        .modal.aberto { display:flex; }
        .modal-content { width:100%; max-width:850px; max-height:92vh; overflow:auto; background:#1a1a1a; border:1px solid #333; border-top:4px solid #007bff; border-radius:10px; padding:22px; box-shadow:0 12px 35px rgba(0,0,0,.55); }
        .modal-cabecalho { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
        .modal-cabecalho h2 { margin:0; font-size:18px; }
        .grid-form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column:1/-1; }
        label { font-size:10px; color:#aaa; text-transform:uppercase; font-weight:700; letter-spacing:.5px; }
        input[type="text"],input[type="url"],input[type="password"] { width:100%; padding:9px 10px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; font:inherit; font-size:13px; outline:none; }
        input:focus { border-color:#007bff; background:#1a1a1a; }
        .senha-ajuda { color:#888; font-size:11px; margin-top:2px; }
        .linha-switch { display:flex; align-items:center; gap:8px; min-height:36px; }
        .secao { margin-top:22px; padding-top:18px; border-top:1px solid #333; }
        .secao-topo { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
        .secao-topo h3 { margin:0; font-size:14px; }
        .mesa-editor { background:#151515; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:10px; }
        .mesa-editor-grid { display:grid; grid-template-columns:1fr 1.2fr; gap:10px; }
        .mesa-editor .url { grid-column:1/-1; }
        .mesa-editor-acoes { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
        .modal-acoes { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; padding-top:15px; border-top:1px solid #333; }
        @media (max-width:800px) { #lista-casas,.grid-form,.mesa-editor-grid { grid-template-columns:1fr; } .mesa-editor .url,.form-group.full { grid-column:auto; } }
    </style>
</head>
<body>
<div class="container">
    <header class="topo">
        <div>
            <h1>🏦 Casas de Aposta</h1>
            <div class="subtitulo">Cadastro administrativo de casas, credenciais e mesas disponíveis.</div>
        </div>
        <div class="acoes">
            <a class="btn secundario" href="/">← Painel</a>
            <button class="btn" id="btn-nova-casa" type="button">＋ Nova casa</button>
        </div>
    </header>

    <section class="toolbar">
        <label><input type="checkbox" id="mostrar-inativas"> Mostrar casas inativas</label>
        <div id="status-global" class="status-msg">Carregando...</div>
    </section>

    <main id="lista-casas" aria-live="polite"></main>
</div>

<div class="modal" id="modal-casa" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-casa">
    <form class="modal-content" id="form-casa">
        <div class="modal-cabecalho">
            <div>
                <h2 id="titulo-modal-casa">Nova casa</h2>
                <div class="subtitulo" id="subtitulo-modal-casa">Cadastre a casa e suas mesas.</div>
            </div>
            <button class="btn secundario pequeno" type="button" id="btn-fechar-modal">Fechar</button>
        </div>

        <input type="hidden" id="house-id">
        <div class="grid-form">
            <div class="form-group"><label for="house-name">Nome</label><input id="house-name" type="text" maxlength="120" required></div>
            <div class="form-group"><label for="house-adapter-key">Adapter key</label><input id="house-adapter-key" type="text" maxlength="80" required placeholder="brasil-da-sorte"></div>
            <div class="form-group full"><label for="house-home-url">URL principal</label><input id="house-home-url" type="url" maxlength="2048" required></div>
            <div class="form-group"><label for="house-username">Usuário</label><input id="house-username" type="text" maxlength="190" autocomplete="username"></div>
            <div class="form-group"><label for="house-password">Senha</label><input id="house-password" type="password" autocomplete="new-password"><div class="senha-ajuda" id="senha-ajuda">Preencha para definir a senha.</div></div>
            <div class="form-group full"><label>Status</label><div class="linha-switch"><input id="house-enabled" type="checkbox" checked><span id="house-enabled-label">Ativa</span></div></div>
        </div>

        <section class="secao">
            <div class="secao-topo"><div><h3>Mesas vinculadas</h3><div class="subtitulo">Cada mesa possui identificador estável e URL própria.</div></div><button class="btn pequeno" type="button" id="btn-adicionar-mesa">＋ Adicionar mesa</button></div>
            <div id="mesas-editor"></div>
        </section>

        <div id="status-modal" class="status-msg"></div>
        <div class="modal-acoes"><button type="button" class="btn secundario" id="btn-cancelar">Cancelar</button><button type="submit" class="btn sucesso" id="btn-salvar">Salvar</button></div>
    </form>
</div>

<script src="/betting-houses.js"></script>
</body>
</html>
