name: Materialize Auto-Trader state machine

on:
  push:
    branches:
      - agent/auto-trader-state-machine-schedules
    paths:
      - .github/workflows/materialize-auto-trader-state-machine.yml
      - robo-bacbo/auto_trader.js
      - robo-bacbo/test/auto_trader.test.js

permissions:
  contents: write

