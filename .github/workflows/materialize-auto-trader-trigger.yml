name: Trigger Auto-Trader native materialization

on:
  push:
    branches:
      - agent/auto-trader-state-machine-schedules
  pull_request:
    branches:
      - agent/auto-trader-state-machine-schedules

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[auto-trader-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-trader-state-machine-schedules
          fetch-depth: 0

      - name: Materialize native source
        run: |
          git apply --recount --check .github/auto-trader-materialization/bot2_coletor.patch
          git apply --recount .github/auto-trader-materialization/bot2_coletor.patch
          git apply --recount --check .github/auto-trader-materialization/dashboard.patch
          git apply --recount .github/auto-trader-materialization/dashboard.patch
          sed -i '/Trigger de materialização nativa do módulo Auto-Trader\./d' robo-bacbo/test/auto_trader.test.js

      - name: Validate native implementation
        run: |
          cd robo-bacbo
          node --check auto_trader.js
          node --check bot2_coletor.js
          node --test test/auto_trader.test.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/dashboard-app.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          const principal = scripts.find(codigo => codigo.includes('const socketWeb = io();'));
          if (!principal) throw new Error('Script principal do dashboard não encontrado');
          new vm.Script(principal, { filename: 'dashboard-inline.js' });
          for (const marcador of [
            'at-gatilho-reds-virtuais',
            'at-sinais-por-onda',
            'at-tipo-aleatoriedade',
            'at-chance-entrada-pct',
            'at-limite-ciclos',
            'at-faixas-horario'
          ]) {
            if (!html.includes(marcador)) throw new Error(`Campo UI ausente: ${marcador}`);
          }
          for (const legado of ['id="at-camuflagem"', 'id="at-hora-inicio"', 'id="at-hora-fim"']) {
            if (html.includes(legado)) throw new Error(`Controle legado ainda presente: ${legado}`);
          }
          NODE
          if grep -E "function horarioParaMinutos|cf\.hora_inicio|cf\.hora_fim|cf\.modo_camuflagem" bot2_coletor.js; then
            echo "Legacy Auto-Trader execution logic remains in backend"
            exit 1
          fi
          cd ..
          git diff --check

      - name: Commit native implementation
        run: |
          rm -f \
            .github/workflows/materialize-auto-trader-state-machine.yml \
            .github/workflows/materialize-auto-trader-trigger.yml \
            .github/auto-trader-materialization/bot2_coletor.patch \
            .github/auto-trader-materialization/dashboard.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            robo-bacbo/auto_trader.js \
            robo-bacbo/test/auto_trader.test.js \
            robo-bacbo/bot2_coletor.js \
            robo-bacbo/public/dashboard-app.html
          git add -u -- \
            .github/workflows/materialize-auto-trader-state-machine.yml \
            .github/workflows/materialize-auto-trader-trigger.yml \
            .github/auto-trader-materialization/bot2_coletor.patch \
            .github/auto-trader-materialization/dashboard.patch
          git diff --cached --check
          git commit -m "refactor(auto-trader): state-machine cycles and multi-window schedules [auto-trader-materialized]"
          git push origin HEAD:agent/auto-trader-state-machine-schedules
