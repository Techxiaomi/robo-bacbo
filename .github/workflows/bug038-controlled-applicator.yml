name: BUG-038 controlled applicator

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - scripts/apply_bug038.py
      - .github/workflows/bug038-controlled-applicator.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-038 patch
        run: python scripts/apply_bug038.py

      - name: Syntax check
        run: python -m py_compile robo-sync-pilot/robo.py

      - name: BUG-038 contract test
        run: python -m unittest discover -s robo-sync-pilot/tests -p 'test_bug038_contract.py'

      - name: Diff check
        run: git diff --check

      - name: Commit validated patch and remove applicator
        run: |
          rm -f scripts/apply_bug038.py .github/workflows/bug038-controlled-applicator.yml
          git config user.name "Techxiaomi"
          git config user.email "144563117+Techxiaomi@users.noreply.github.com"
          git add -A
          git commit -m "BUG-038: reduzir latência crítica do executor Evolution"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
