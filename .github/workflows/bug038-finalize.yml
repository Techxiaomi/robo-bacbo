name: BUG-038 finalize tests

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - scripts/apply_bug038_ci_followup.py
      - .github/workflows/bug038-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BUG-038 test alignment
        run: python scripts/apply_bug038_ci_followup.py
      - name: Validate changed tests
        run: |
          python -m py_compile robo-sync-pilot/tests/test_playwright_dom.py
          git diff --check
      - name: Restore normal CI and commit
        shell: bash
        run: |
          git show d3fe7b5781317e42717e28444a27753cd6fb3e8e:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/apply_bug038_ci_followup.py .github/workflows/bug038-finalize.yml
          git config user.name "Techxiaomi"
          git config user.email "144563117+Techxiaomi@users.noreply.github.com"
          git add -A
          git commit -m "test: alinhar regressões ao fast path BUG-038"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
