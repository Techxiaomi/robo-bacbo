name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-bug016:
    name: Apply BUG-016 frontend patch
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/bug-016-dashboard-real-dispatches'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-016-dashboard-real-dispatches

      - name: Apply dashboard frontend patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('robo-bacbo/public/index.html')
          text = path.read_text(encoding='utf-8')

          marker = "        function mudarAbaAT(aba) {"
          if marker not in text:
              raise SystemExit('BUG-016 anchor not found')

          patch = r'''        let dashboardAtualizacaoSeq = 0;

        function atualizarBotoesPeriodoDashboard() {
            const periodosValidos = new Set(['24h', 'hoje', 'semana', 'mes', 'geral']);
            if (!periodosValidos.has(dashPeriodoAtual)) dashPeriodoAtual = '24h';

            document.querySelectorAll('.btn-dash').forEach(btn => {
                const ativo = btn.id === `btn-dash-${dashPeriodoAtual}`;
                btn.style.background = ativo ? '#007bff' : 'transparent';
                btn.style.color = ativo ? '#fff' : '#888';
                btn.setAttribute('aria-pressed', ativo ? 'true' : 'false');
            });
        }

        function renderizarDashboardIndisponivel() {
            ['dash-sinais', 'dash-greens', 'dash-reds', 'dash-assertividade'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerText = '—';
            });
            const boxAssert = document.getElementById('box-assertividade');
            const labelAssert = document.getElementById('label-assertividade');
            if (boxAssert) boxAssert.style.borderColor = '#666';
            if (labelAssert) labelAssert.style.color = '#888';
        }

        async function atualizarDashboardValores() {
            atualizarBotoesPeriodoDashboard();

            const roboId = document.getElementById('select-robo-dash')?.value || 'TODOS';
            const origem = document.getElementById('select-origem-dash')?.value || 'TODAS';
            const periodosValidos = new Set(['24h', 'hoje', 'semana', 'mes', 'geral']);
            const periodo = periodosValidos.has(dashPeriodoAtual) ? dashPeriodoAtual : '24h';
            dashPeriodoAtual = periodo;

            const params = new URLSearchParams();
            params.set('robo_id', roboId);
            params.set('periodo', periodo);
            params.set('origem', origem);
            params.set('_t', String(Date.now()));

            const requestSeq = ++dashboardAtualizacaoSeq;
            try {
                const res = await fetch(`/api/dashboard-stats?${params.toString()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (requestSeq !== dashboardAtualizacaoSeq) return;

                const inteiroSeguro = valor => {
                    const numero = Number(valor);
                    return Number.isFinite(numero) && numero >= 0 ? Math.floor(numero) : 0;
                };
                const sinais = inteiroSeguro(data.sinais);
                const greens = inteiroSeguro(data.greens);
                const reds = inteiroSeguro(data.reds);
                const assertNumero = Number.parseFloat(String(data.assertividade ?? '').replace('%', ''));
                const assertividade = Number.isFinite(assertNumero) && assertNumero >= 0
                    ? Math.min(100, assertNumero)
                    : (sinais > 0 ? (greens / sinais) * 100 : 0);
                const assertTexto = `${assertividade.toFixed(1)}%`;

                document.getElementById('dash-sinais').innerText = sinais;
                document.getElementById('dash-greens').innerText = greens;
                document.getElementById('dash-reds').innerText = reds;
                document.getElementById('dash-assertividade').innerText = assertTexto;

                const corAssert = getCor(assertividade);
                document.getElementById('dash-assertividade').style.color = corAssert;
                document.getElementById('box-assertividade').style.borderColor = corAssert;
                document.getElementById('label-assertividade').style.color = corAssert;
            } catch (erro) {
                if (requestSeq !== dashboardAtualizacaoSeq) return;
                console.error('Falha ao atualizar Resumo Executivo:', erro);
                renderizarDashboardIndisponivel();
            }
        }

        async function mudarDashGeral(periodo) {
            const periodosValidos = new Set(['24h', 'hoje', 'semana', 'mes', 'geral']);
            if (!periodosValidos.has(periodo)) return;
            dashPeriodoAtual = periodo;
            atualizarBotoesPeriodoDashboard();
            atualizarCardAtivoDinamicamente();
            await atualizarDashboardValores();
        }

        async function mudarFiltrosDash() {
            await atualizarDashboardValores();
        }

'''

          if 'async function atualizarDashboardValores()' not in text:
              text = text.replace(marker, patch + marker, 1)

          antigo = """            if (tipoCard === 'ativo') {
                dashPeriodoAtual = periodo;
                atualizarCardAtivoDinamicamente();
                return;
            }
"""
          novo = """            if (tipoCard === 'ativo') {
                dashPeriodoAtual = periodo;
                atualizarCardAtivoDinamicamente();
                atualizarBotoesPeriodoDashboard();
                atualizarDashboardValores();
                return;
            }
"""
          if antigo in text:
              text = text.replace(antigo, novo, 1)
          elif novo not in text:
              raise SystemExit('BUG-016 active-card period anchor not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit patch to feature branch
        shell: bash
        run: |
          if git diff --quiet -- robo-bacbo/public/index.html; then
            echo "BUG-016 already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/public/index.html
          git commit -m "BUG-016: restaurar dashboard de disparos reais"
          git push origin HEAD:agent/bug-016-dashboard-real-dispatches

  node-tests:
    name: Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check backend syntax
        run: node --check bot2_coletor.js
        working-directory: robo-bacbo

      - name: Run Node tests
        run: npm test
        working-directory: robo-bacbo

  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile robo.py tests/test_pure_logic.py
        working-directory: robo-sync-pilot

      - name: Run Python tests
        run: python tests/test_pure_logic.py
        working-directory: robo-sync-pilot

  executor-idempotency:
    name: Executor restart idempotency integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated Flask dependency
        run: python -m pip install --disable-pip-version-check Flask==3.1.3

      - name: Check executor restart integration syntax
        run: python -m py_compile integration/executor-idempotency-restart.py
        working-directory: robo-sync-pilot

      - name: Run executor restart idempotency integration
        run: python integration/executor-idempotency-restart.py
        working-directory: robo-sync-pilot

  backend-integration:
    name: Backend HTTP + Socket.IO + MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: bacbo_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated integration dependencies
        shell: bash
        run: |
          DEPS_DIR="$RUNNER_TEMP/bacbo-node-deps"
          mkdir -p "$DEPS_DIR"
          cd "$DEPS_DIR"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            express@5.2.1 mysql2@3.23.3 socket.io@4.8.3 socket.io-client@4.8.3
          echo "NODE_PATH=$(npm root)" >> "$GITHUB_ENV"

      - name: Check integration test syntax
        run: node --check integration/http-mysql-smoke.js
        working-directory: robo-bacbo

      - name: Run real backend integration smoke
        run: node integration/http-mysql-smoke.js
        working-directory: robo-bacbo

  playwright-dom:
    name: Playwright controlled DOM integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated Playwright dependency
        run: python -m pip install --disable-pip-version-check playwright==1.62.0

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Check Playwright DOM test syntax
        run: python -m py_compile tests/test_playwright_dom.py
        working-directory: robo-sync-pilot

      - name: Run controlled Playwright DOM integration
        run: python tests/test_playwright_dom.py
        working-directory: robo-sync-pilot

  controlled-e2e:
    name: Controlled collector + Node + executor + MySQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: bacbo_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated E2E dependencies
        shell: bash
        run: |
          DEPS_DIR="$RUNNER_TEMP/bacbo-e2e-node-deps"
          mkdir -p "$DEPS_DIR"
          cd "$DEPS_DIR"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            express@5.2.1 mysql2@3.23.3 socket.io@4.8.3
          echo "NODE_PATH=$(npm root)" >> "$GITHUB_ENV"

      - name: Check controlled E2E syntax
        run: |
          node --check robo-bacbo/integration/controlled-e2e-smoke.js
          python -m py_compile robo-sync-pilot/integration/emit-controlled-result.py

      - name: Run controlled collector-to-audit E2E
        run: node integration/controlled-e2e-smoke.js
        working-directory: robo-bacbo
