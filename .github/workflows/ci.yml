name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-bug042-testfix:
    name: Apply BUG-042 Playwright contract fix
    if: github.head_ref == 'agent/bug-023-websocket-reconnect-continuity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply test fix
        run: python scripts/apply_bug042_testfix.py
      - name: Syntax check
        run: python -m py_compile robo-sync-pilot/tests/test_playwright_dom.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/tests/test_playwright_dom.py
          if git diff --cached --quiet; then
            echo "No BUG-042 test fix to commit"
            exit 0
          fi
          git commit -m "test: isolate BUG-039 debit confirmation contract"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
