name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-bug042:
    name: Apply BUG-042 pointer-event patch
    if: github.head_ref == 'agent/bug-023-websocket-reconnect-continuity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical patch
        run: python scripts/apply_bug042_pointer_events.py
      - name: Syntax checks
        run: |
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py robo-sync-pilot/tests/test_playwright_dom.py
          node --check robo-bacbo/support/pure-logic-suite.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py robo-sync-pilot/tests/test_playwright_dom.py robo-bacbo/support/pure-logic-suite.js
          if git diff --cached --quiet; then
            echo "No BUG-042 changes to commit"
            exit 0
          fi
          git commit -m "fix: dispatch pointer events for Evolution financial controls"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
