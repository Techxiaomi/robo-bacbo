name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check backend syntax
        run: node --check bot2_coletor.js
        working-directory: robo-bacbo

      - name: Run Node tests
        run: npm test
        working-directory: robo-bacbo

  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile robo.py tests/test_pure_logic.py
        working-directory: robo-sync-pilot

      - name: Run Python tests
        run: python tests/test_pure_logic.py
        working-directory: robo-sync-pilot