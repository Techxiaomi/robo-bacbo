name: BUG-044 native click patch

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - .github/workflows/bug044-native-click.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BUG-044 patch
        run: python scripts/apply_bug044_native_click.py
      - name: Syntax and contract checks
        run: |
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py
          python robo-sync-pilot/tests/test_bug038_contract.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py
          if git diff --cached --quiet; then
            echo "No BUG-044 changes to commit"
            exit 0
          fi
          git commit -m "fix: restore native Playwright click after modal cleanup"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
