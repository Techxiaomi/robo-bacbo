name: BUG-014B apply

on:
  push:
    branches:
      - agent/bug-014b-executor-lifecycle
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/agent/bug-014b-executor-lifecycle' || github.head_ref == 'agent/bug-014b-executor-lifecycle')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-014b-executor-lifecycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded patch
        run: |
          python scripts/apply_bug014b.py
          python scripts/fix_bug014b_generated_test.py

      - name: Syntax checks
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/integration/controlled-e2e-smoke.js
          node --check robo-bacbo/test/order-intent.test.js
          python -m py_compile robo-sync-pilot/robo.py \
            robo-sync-pilot/tests/test_pure_logic.py \
            robo-sync-pilot/tests/test_playwright_dom.py \
            robo-sync-pilot/integration/executor-idempotency-restart.py

      - name: Node regression tests
        run: npm test
        working-directory: robo-bacbo

      - name: Python pure regression tests
        run: python tests/test_pure_logic.py
        working-directory: robo-sync-pilot

      - name: Install isolated Flask dependency
        run: python -m pip install --disable-pip-version-check Flask==3.1.3

      - name: Executor readiness/restart integration
        run: python integration/executor-idempotency-restart.py
        working-directory: robo-sync-pilot

      - name: Diff hygiene
        run: git diff --check

      - name: Commit BUG-014B
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example CHANGELOG.md \
            docs/CURRENT_STATE.md docs/KNOWN_ISSUES.md docs/GEMINI_HANDOFF.md \
            robo-bacbo/bot2_coletor.js \
            robo-bacbo/integration/controlled-e2e-smoke.js \
            robo-bacbo/test/order-intent.test.js \
            robo-sync-pilot/robo.py \
            robo-sync-pilot/tests/test_pure_logic.py \
            robo-sync-pilot/tests/test_playwright_dom.py \
            robo-sync-pilot/integration/executor-idempotency-restart.py
          git commit -m 'BUG-014B: confirmar lifecycle real do executor'
          git push origin HEAD:agent/bug-014b-executor-lifecycle
