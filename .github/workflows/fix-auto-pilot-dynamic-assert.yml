name: Fix Auto Pilot Dynamic Assertivity

on:
  push:
    branches:
      - agent/auto-pilot-ia-selection-engine
    paths:
      - .github/scripts/fix_auto_pilot_dynamic_assert.py
      - .github/workflows/fix-auto-pilot-dynamic-assert.yml
      - robo-bacbo/test/auto_pilot_integration_contract.test.js

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auto-pilot-ia-selection-engine
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply dynamic assertivity patch
        run: python .github/scripts/fix_auto_pilot_dynamic_assert.py

      - name: Syntax checks
        run: |
          node --check robo-bacbo/auto_pilot_ia.js
          node --check robo-bacbo/bot2_coletor.js

      - name: Full Node regression suite
        working-directory: robo-bacbo
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Remove temporary applicator
        run: |
          rm .github/scripts/fix_auto_pilot_dynamic_assert.py
          rm .github/workflows/fix-auto-pilot-dynamic-assert.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/test/auto_pilot_integration_contract.test.js .github/scripts/fix_auto_pilot_dynamic_assert.py .github/workflows/fix-auto-pilot-dynamic-assert.yml
          git diff --cached --check
          git commit -m "AUTO-PILOT: alinhar assertividade dos padrões IA"
          git push origin HEAD:agent/auto-pilot-ia-selection-engine
