name: BUG-039 test contract

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - scripts/apply_bug039_test_contract.py
      - .github/workflows/bug039-test-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract update
        run: python scripts/apply_bug039_test_contract.py
      - name: Validate Node contract
        run: node --test support/pure-logic-suite.js
        working-directory: robo-bacbo
      - name: Commit contract update
        shell: bash
        run: |
          git config user.name "Techxiaomi"
          git config user.email "144563117+Techxiaomi@users.noreply.github.com"
          git add robo-bacbo/support/pure-logic-suite.js
          git commit -m "test: alinhar contrato Node ao BUG-039"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
