name: BUG-019 temporary applicator

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bug-019-tie-protection-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-019-tie-protection-execution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-019
        run: python scripts/apply_bug019.py

      - name: Align generated tests with existing harness
        shell: python
        run: |
          from pathlib import Path
          import re

          pure_path = Path('robo-sync-pilot/tests/test_pure_logic.py')
          pure = pure_path.read_text(encoding='utf-8')
          pure = pure.replace(
              '    FUNCOES = [\n        "persistir_ordens_executor",',
              '    FUNCOES = [\n        "normalizar_apostas_recebidas",\n        "persistir_ordens_executor",',
              1
          )
          start = pure.find('class Bug019CompositePayloadTests')
          end = pure.find('if __name__ == "__main__":', start)
          if start < 0 or end < 0:
              raise RuntimeError('Bloco temporario BUG-019 de pure logic nao encontrado')
          novo_pure = '''class Bug019CompositePayloadTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  ns = {}
                  carregar_funcoes(["normalizar_apostas_recebidas"], ns)
                  cls.normalizar = staticmethod(ns["normalizar_apostas_recebidas"])

              def test_normaliza_ordem_composta_principal_mais_tie(self):
                  apostas = self.normalizar({"apostas": [
                      {"alvo": "PlayerWon", "valor": 20},
                      {"alvo": "Tie", "valor": 5}
                  ]})
                  self.assertEqual(apostas, [
                      {"alvo": "PlayerWon", "valor": 20.0},
                      {"alvo": "Tie", "valor": 5.0}
                  ])

              def test_rejeita_valor_nao_representavel_e_alvo_duplicado(self):
                  with self.assertRaises(ValueError):
                      self.normalizar({"apostas": [{"alvo": "PlayerWon", "valor": 7}]})
                  with self.assertRaises(ValueError):
                      self.normalizar({"apostas": [
                          {"alvo": "Tie", "valor": 5}, {"alvo": "Tie", "valor": 10}
                      ]})

          '''
          novo_pure = '\n'.join(line[10:] if line.startswith('          ') else line for line in novo_pure.splitlines()) + '\n\n'
          pure = pure[:start] + novo_pure + pure[end:]
          pure_path.write_text(pure, encoding='utf-8')

          pw_path = Path('robo-sync-pilot/tests/test_playwright_dom.py')
          pw = pw_path.read_text(encoding='utf-8')
          pw = pw.replace(
              '        "parsear_valor_monetario",\n',
              '        "normalizar_apostas_recebidas",\n        "parsear_valor_monetario",\n',
              1
          )
          start = pw.find('    def test_bug019_ordem_composta_prevalida_e_executa_principal_mais_tie')
          end = pw.find('if __name__ == "__main__":', start)
          if start < 0 or end < 0:
              raise RuntimeError('Bloco temporario BUG-019 de Playwright nao encontrado')
          teste = '''    def test_bug019_ordem_composta_prevalida_e_executa_principal_mais_tie(self):
              pagina = self.nova_pagina("/game.html")
              try:
                  frame = self.frame_jogo(pagina)
                  resultado = executar_aposta_na_tela(pagina, {"apostas": [
                      {"alvo": "PlayerWon", "valor": 10},
                      {"alvo": "Tie", "valor": 5}
                  ]})
                  self.assertEqual(resultado["status"], "EXECUTADA")
                  self.assertEqual(resultado["cliques_alvo"], 2)
                  chips = frame.evaluate("window.__chipClicks")
                  alvos = frame.evaluate("window.__targetClicks")
                  self.assertEqual(chips["10"], 1)
                  self.assertEqual(chips["5"], 1)
                  self.assertEqual(alvos["playerA"], 1)
                  self.assertEqual(alvos["tie"], 1)
              finally:
                  pagina.close()

          '''
          teste = '\n'.join(line[10:] if line.startswith('          ') else line for line in teste.splitlines()) + '\n\n'
          pw = pw[:start] + teste + pw[end:]
          pw_path.write_text(pw, encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/tie_protection.js
          python -m py_compile robo-sync-pilot/robo.py
          python -m py_compile robo-sync-pilot/tests/test_pure_logic.py
          python -m py_compile robo-sync-pilot/tests/test_playwright_dom.py
          git diff --check

      - name: Node regression tests
        working-directory: robo-bacbo
        run: npm test

      - name: Python regression tests
        working-directory: robo-sync-pilot
        run: python tests/test_pure_logic.py

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/dashboard-app.html robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py robo-sync-pilot/tests/test_playwright_dom.py docs/KNOWN_ISSUES.md
          git commit -m "BUG-019: aplicar proteção financeira no empate"
          git push origin HEAD:agent/bug-019-tie-protection-execution
