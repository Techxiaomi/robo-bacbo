name: Apply BUG-051 Auto-Trader hardening

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - scripts/.bug051-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: python scripts/apply_bug051_autotrader_hardening.py

      - name: Validate backend syntax
        run: node --check bot2_coletor.js
        working-directory: robo-bacbo

      - name: Run existing pure logic contracts
        run: node --test support/pure-logic-suite.js
        working-directory: robo-bacbo

      - name: Run BUG-051 contracts
        run: node --test test/bug051-contract.test.js
        working-directory: robo-bacbo

      - name: Validate diff
        run: git diff --check

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/index.html robo-bacbo/test/bug051-contract.test.js
          git commit -m "fix: harden auto-trader lifecycle and audit [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
