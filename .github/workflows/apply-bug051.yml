name: Apply BUG-051 Auto-Trader hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bug-023-websocket-reconnect-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-051 to production targets
        run: |
          python scripts/prepare_bug051_patcher.py
          python scripts/apply_bug051_autotrader_hardening.py
          python scripts/apply_bug051_followup.py
          python - <<'PY'
          from pathlib import Path

          node_test = Path('robo-bacbo/support/pure-logic-suite.js')
          s = node_test.read_text(encoding='utf-8')
          replacements = [
              ('BUG-046: executor ancora a janela em Resolved + 8s e Node preserva o callback',
               'BUG-046/049: executor ancora a janela em Resolved + 8.5s e Node preserva o callback'),
              (r'/alvo_temporal = resolved_base \\+ 8\\.0/', r'/alvo_temporal = resolved_base \\+ 8\\.5/'),
              (r'/janela real alvo em \\+8000ms/', r'/janela real alvo em \\+8500ms/'),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
          if r'/alvo_temporal = resolved_base \\+ 8\\.5/' not in s:
              raise SystemExit('Resolved +8.5 contract not present after patch')
          if r'/janela real alvo em \\+8500ms/' not in s:
              raise SystemExit('+8500ms log contract not present after patch')
          node_test.write_text(s, encoding='utf-8')

          py_test = Path('robo-sync-pilot/tests/test_pure_logic.py')
          s = py_test.read_text(encoding='utf-8')
          if 'self.assertIn("permaneceu inalterado", resultado["motivo"])' in s:
              s = s.replace(
                  'self.assertIn("permaneceu inalterado", resultado["motivo"])',
                  'self.assertIn("não sofreu débito adicional", resultado["motivo"])',
                  1,
              )
          if 'self.assertIn("não sofreu débito adicional", resultado["motivo"])' not in s:
              raise SystemExit('financial acceptance contract not updated')
          py_test.write_text(s, encoding='utf-8')
          PY

      - name: Validate syntax
        run: |
          node --check robo-bacbo/bot2_coletor.js
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py

      - name: Run existing Node logic contracts
        run: |
          cd robo-bacbo
          node --test support/pure-logic-suite.js

      - name: Run BUG-051 contract
        run: |
          cd robo-bacbo
          node --test test/bug051-contract.test.js

      - name: Run Python logic contracts
        run: |
          cd robo-sync-pilot
          python tests/test_pure_logic.py

      - name: Validate diff
        run: git diff --check

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/dashboard-app.html robo-bacbo/support/pure-logic-suite.js robo-bacbo/test/bug051-contract.test.js robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py
          git commit -m "fix: harden auto-trader lifecycle and audit [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
