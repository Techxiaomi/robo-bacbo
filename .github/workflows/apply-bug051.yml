name: Apply BUG-051 Auto-Trader hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bug-023-websocket-reconnect-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-051
        run: |
          python scripts/prepare_bug051_patcher.py
          python scripts/apply_bug051_autotrader_hardening.py
          python scripts/apply_bug051_followup.py

      - name: Validate syntax
        run: |
          node --check robo-bacbo/bot2_coletor.js
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py

      - name: Run existing Node logic contracts
        run: |
          cd robo-bacbo
          node --test support/pure-logic-suite.js

      - name: Run BUG-051 contract
        run: |
          cd robo-bacbo
          node --test test/bug051-contract.test.js

      - name: Run Python logic contracts
        run: |
          cd robo-sync-pilot
          python tests/test_pure_logic.py

      - name: Validate diff
        run: git diff --check

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/dashboard-app.html robo-bacbo/support/pure-logic-suite.js robo-bacbo/test/bug051-contract.test.js robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py
          git commit -m "fix: harden auto-trader lifecycle and audit [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
