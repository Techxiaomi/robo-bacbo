name: Polish Auto Pilot History Cleanup

on:
  push:
    branches:
      - agent/auto-pilot-ia-selection-engine
    paths:
      - .github/scripts/polish_auto_pilot_history_cleanup.py
      - .github/workflows/polish-auto-pilot-history-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auto-pilot-ia-selection-engine
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply cleanup polish
        run: python .github/scripts/polish_auto_pilot_history_cleanup.py

      - name: Validate
        run: |
          node --check robo-bacbo/auto_pilot_ia.js
          node --check robo-bacbo/bot2_coletor.js
          cd robo-bacbo
          npm test

      - name: Diff check
        run: git diff --check

      - name: Remove temporary applicator
        run: |
          rm .github/scripts/polish_auto_pilot_history_cleanup.py
          rm .github/workflows/polish-auto-pilot-history-cleanup.yml

      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/auto_pilot_ia.js robo-bacbo/bot2_coletor.js robo-bacbo/test/auto_pilot_lifecycle.test.js .github/scripts/polish_auto_pilot_history_cleanup.py .github/workflows/polish-auto-pilot-history-cleanup.yml
          git diff --cached --check
          git commit -m "AUTO-PILOT: tornar limpeza de histórico IA exata"
          git push origin HEAD:agent/auto-pilot-ia-selection-engine
