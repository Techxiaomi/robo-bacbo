name: Temporary bacbo_events base trigger

on:
  pull_request:
    branches:
      - agent/balance-sync-redis-node

permissions:
  contents: write

jobs:
  patch-base:
    if: github.head_ref == 'agent/temp-trigger-bacbo-events'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/balance-sync-redis-node
          fetch-depth: 0

      - name: Extract and run bot2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/temp-bacbo-events-bot2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/patch_bot2.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/patch_bot2.py

      - name: Validate JavaScript syntax and ownership
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/redis_executor_bridge.js
          grep -F "redisSubscriber.subscribe('bacbo_events'" robo-bacbo/bot2_coletor.js
          grep -F "app.post(\"/receber-sinal\", processarReceberSinal);" robo-bacbo/bot2_coletor.js

      - name: Commit final patch into base branch
        run: |
          git rm -- .github/workflows/temp-bacbo-events-bot2.yml .github/workflows/temp-bacbo-events-pr.yml .github/workflows/temp-bacbo-events-base-trigger.yml
          git add -- robo-bacbo/bot2_coletor.js robo-bacbo/redis_executor_bridge.js
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: processar bacbo_events diretamente no bot2"
          git push origin HEAD:agent/balance-sync-redis-node
