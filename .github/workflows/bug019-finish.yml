name: BUG-019 finishing pass

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'agent/bug-019-tie-protection-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-019-tie-protection-execution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply finishing pass
        run: python scripts/finish_bug019.py

      - name: Syntax and regression checks
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/integration/controlled-e2e-smoke.js
          node --check robo-bacbo/test/order-intent.test.js
          python -m py_compile robo-bacbo/integration/dashboard-browser-smoke.py
          python -m py_compile robo-sync-pilot/robo.py
          git diff --check
          cd robo-bacbo && npm test
          cd ../robo-sync-pilot && python tests/test_pure_logic.py

      - name: Commit finishing pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/dashboard-app.html robo-bacbo/test/order-intent.test.js robo-bacbo/integration/controlled-e2e-smoke.js robo-bacbo/integration/dashboard-browser-smoke.py
          git commit -m "BUG-019: finalizar integração e testes de proteção no empate"
          git push origin HEAD:agent/bug-019-tie-protection-execution
