name: Apply BUG-047 fast path

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-bug047:
    if: github.event.pull_request.head.ref == 'agent/bug-023-websocket-reconnect-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Apply surgical patch
        run: python scripts/apply_bug047_fastpath.py
      - name: Validate syntax
        run: python -m py_compile robo-sync-pilot/robo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py
          git commit -m "fix: force fast path at Resolved plus 8 seconds [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
