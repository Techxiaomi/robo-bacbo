name: BUG-039 apply

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - scripts/apply_bug039.py
      - .github/workflows/bug039-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BUG-039
        run: python scripts/apply_bug039.py
      - name: Validate syntax and diff
        run: |
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_playwright_dom.py
          git diff --check
      - name: Commit source and tests
        shell: bash
        run: |
          git config user.name "Techxiaomi"
          git config user.email "144563117+Techxiaomi@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_playwright_dom.py
          git commit -m "fix: BUG-039 confirmar cada perna financeira"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
