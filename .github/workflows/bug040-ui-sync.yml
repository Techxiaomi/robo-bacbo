name: BUG-040 UI sync patch

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - .github/workflows/bug040-ui-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BUG-040 surgical patch
        run: python scripts/apply_bug040_ui_sync.py
      - name: Syntax checks
        run: |
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py robo-sync-pilot/tests/test_playwright_dom.py
          node --check robo-bacbo/support/pure-logic-suite.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py robo-sync-pilot/tests/test_playwright_dom.py robo-bacbo/support/pure-logic-suite.js
          if git diff --cached --quiet; then
            echo "No BUG-040 changes to commit"
            exit 0
          fi
          git commit -m "fix: synchronize Evolution UI before financial clicks"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
