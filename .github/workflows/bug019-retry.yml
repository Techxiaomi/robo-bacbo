name: BUG-019 retry applicator

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bug-019-tie-protection-execution'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bug-019-tie-protection-execution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-019
        run: |
          python scripts/run_apply_bug019.py
          python scripts/fix_bug019_tests.py

      - name: Syntax checks
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/tie_protection.js
          python -m py_compile robo-sync-pilot/robo.py
          python -m py_compile robo-sync-pilot/tests/test_pure_logic.py
          python -m py_compile robo-sync-pilot/tests/test_playwright_dom.py
          git diff --check

      - name: Node regression tests
        working-directory: robo-bacbo
        run: npm test

      - name: Python regression tests
        working-directory: robo-sync-pilot
        run: python tests/test_pure_logic.py

      - name: Commit generated production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js robo-bacbo/public/dashboard-app.html robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py robo-sync-pilot/tests/test_playwright_dom.py docs/KNOWN_ISSUES.md
          git commit -m "BUG-019: aplicar proteção financeira no empate"
          git push origin HEAD:agent/bug-019-tie-protection-execution
