name: Apply BUG-050 target and robot lock

on:
  push:
    paths:
      - 'scripts/.bug050-trigger'

permissions:
  contents: write

jobs:
  apply-bug050:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Apply surgical patch
        run: python scripts/apply_bug050_target_and_robot_lock.py
      - name: Validate Python syntax
        run: python -m py_compile robo-sync-pilot/robo.py
      - name: Validate Node syntax
        run: node --check robo-bacbo/bot2_coletor.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-bacbo/bot2_coletor.js
          git commit -m "fix: bind financial clicks to target and serialize robot cycles [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
