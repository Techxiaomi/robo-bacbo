name: Apply BUG-018 temporary patch

on:
  push:
    branches:
      - agent/bug-018-betting-window-sync
    paths:
      - scripts/apply_bug018.py
      - .github/workflows/apply-bug018.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-018-betting-window-sync
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BUG-018
        run: python scripts/apply_bug018.py

      - name: Check Python syntax
        run: |
          python -m py_compile robo-sync-pilot/robo.py
          python -m py_compile robo-sync-pilot/tests/test_playwright_dom.py
          python -m py_compile robo-sync-pilot/tests/test_pure_logic.py

      - name: Run pure Python regression
        run: python -m unittest discover -s robo-sync-pilot/tests -p 'test_pure_logic.py' -v

      - name: Check Node syntax
        run: node --check robo-bacbo/bot2_coletor.js

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit applied patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example docs/KNOWN_ISSUES.md robo-bacbo/bot2_coletor.js robo-sync-pilot/robo.py robo-sync-pilot/tests/test_playwright_dom.py robo-sync-pilot/tests/test_pure_logic.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'BUG-018: sincronizar execução com janela de apostas'
          git push origin HEAD:agent/bug-018-betting-window-sync
