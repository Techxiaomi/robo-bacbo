name: BUG-046 result timer simplification

on:
  push:
    branches:
      - agent/bug-023-websocket-reconnect-continuity
    paths:
      - .github/workflows/bug046-result-timer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BUG-046 patch
        run: python scripts/apply_bug046_result_timer_simplify.py
      - name: Syntax and contract checks
        run: |
          python -m py_compile robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py
          python robo-sync-pilot/tests/test_bug038_contract.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_bug038_contract.py
          if git diff --cached --quiet; then
            echo "No BUG-046 changes to commit"
            exit 0
          fi
          git commit -m "fix: align betting window to 8s after Resolved"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
