name: Apply BUG-049 compound window

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  apply-bug049:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 68 &&
      github.event.comment.body == '/apply-bug049'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-023-websocket-reconnect-continuity
      - name: Apply surgical patch
        run: python scripts/apply_bug049_compound_window.py
      - name: Validate syntax
        run: python -m py_compile robo-sync-pilot/robo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-sync-pilot/robo.py
          git commit -m "fix: stabilize composite betting window at 8.5 seconds [skip ci]"
          git push origin HEAD:agent/bug-023-websocket-reconnect-continuity
