name: Apply UX-002-003

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ux-002-003-robot-dashboard-stats'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply backend patch
        run: python .github/scripts/apply-ux-002-003.py

      - name: Check backend syntax
        run: node --check robo-bacbo/bot2_coletor.js

      - name: Run Node regression tests
        run: npm test
        working-directory: robo-bacbo

      - name: Check diff
        run: git diff --check

      - name: Commit functional patch when needed
        shell: bash
        run: |
          if git diff --quiet -- robo-bacbo/bot2_coletor.js; then
            echo "No backend changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-bacbo/bot2_coletor.js
          git commit -m "UX-002/003: calcular empates e máximas de sequência"
          git push origin HEAD:${{ github.head_ref }}
