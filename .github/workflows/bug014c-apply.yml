name: BUG-014C apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bug-014c-serialize-round-processing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-014c-serialize-round-processing
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded patch
        run: |
          python scripts/fix_apply_bug014c.py
          python -m py_compile scripts/apply_bug014c.py
          python scripts/apply_bug014c.py

      - name: Syntax checks
        run: |
          node --check robo-bacbo/bot2_coletor.js
          node --check robo-bacbo/integration/controlled-e2e-smoke.js
          node --check robo-bacbo/test/round-serialization.test.js

      - name: Node regression tests
        run: npm test
        working-directory: robo-bacbo

      - name: Diff hygiene
        run: git diff --check

      - name: Commit BUG-014C
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            docs/CURRENT_STATE.md docs/KNOWN_ISSUES.md docs/GEMINI_HANDOFF.md \
            robo-bacbo/bot2_coletor.js \
            robo-bacbo/integration/controlled-e2e-smoke.js \
            robo-bacbo/test/round-serialization.test.js
          git commit -m 'BUG-014C: serializar processamento de rodadas'
          git push origin HEAD:agent/bug-014c-serialize-round-processing
