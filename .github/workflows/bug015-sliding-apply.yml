name: BUG-015 sliding apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/bug-015-dedup-resolved-frames'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bug-015-dedup-resolved-frames
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply sliding window patch
        run: python scripts/fix_bug015_sliding_window.py

      - name: Validate Python regression suite
        run: |
          python -m py_compile robo.py tests/test_pure_logic.py integration/emit-controlled-result.py
          python tests/test_pure_logic.py
        working-directory: robo-sync-pilot

      - name: Diff hygiene
        run: git diff --check

      - name: Commit sliding window fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add robo-sync-pilot/robo.py robo-sync-pilot/tests/test_pure_logic.py
          git commit -m 'BUG-015: tornar deduplicação temporal deslizante'
          git push origin HEAD:agent/bug-015-dedup-resolved-frames
